# Test site on GitHub Pages: every push to main builds the app and publishes it.
# Setup steps are in README.md ("Test site").
name: Test site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      # The tiles sit outside public/, so the build doesn't copy them by itself.
      - name: Add basemap tiles
        run: mkdir -p dist/tiles && cp tiles/ibaraki.pmtiles dist/tiles/
      # A second copy with the debug date bar, at /FloraMap/debug/. It reads the main copy's
      # tiles, so the 35 MB file isn't uploaded twice. The data was built by the step above.
      - name: Debug copy
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/debug/" --outDir dist/debug
        env:
          VITE_DEBUG: 'true'
          VITE_TILES_URL: ${{ steps.pages.outputs.base_path }}/tiles/ibaraki.pmtiles
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
