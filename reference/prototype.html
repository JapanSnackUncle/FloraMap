<style>
/* VOICE: a working map app prototype, calm and legible, the debug bar clearly separate.
   IDEA: the prefecture as a printed field map with photo pins, like a park guide.
   PICTURE: the map itself, with stage rings on photo pins.
   COLOUR and TYPE: land sage, sea pale blue, stage pinks from the mockup; Inter + Noto Sans JP.
   LAYOUT: debug bar on top; map left, list/detail right; stacked below 860px. */
:root{color-scheme:light dark;--bg:light-dark(#F7F6F2,#141412);--ink:light-dark(#1C1917,#EDEBE6);--mute:light-dark(#57534E,#A8A29E);--line:light-dark(#E7E5E4,#33302C);--card:light-dark(#FFFFFF,#1E1D1A);--land:light-dark(#E4EADB,#25291F);--landedge:light-dark(#B9C7A8,#4A5640);--sea:light-dark(#D9E7EE,#16232A);--lake:light-dark(#C9DDE7,#1E3540);--debug:light-dark(#1C1917,#000);--track:#E7E5E4;--start:#E58FAD;--peak:#B0245C;--past:#9E7F89;--lstart:#E9A23B;--lpeak:#C2410C;--lpast:#8C6A4F;--fest:#E0701F}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Noto Sans JP',sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.debug{background:var(--debug);color:#F5F5F4;padding:10px max(2vw,12px);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.debug b{font-weight:700;color:#FBBF24;letter-spacing:.02em}
.debug input[type=date]{background:#292524;border:1px solid #44403C;border-radius:8px;padding:6px 8px;height:38px;font-size:16px;color-scheme:dark}
.debug .btn{height:38px;min-width:38px;padding:0 10px;border-radius:8px;border:1px solid #44403C;background:#292524;color:#F5F5F4;white-space:nowrap}
.debug .btn:hover{background:#3A3532}
.debug .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.debug input[type=range]{width:min(420px,70vw);accent-color:#FBBF24}
.debug label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.debug .note{color:#A8A29E}
.prov{background:#FEF3C7;color:#78350F;padding:8px max(2vw,12px);font-size:13px;border-bottom:1px solid #FCD34D}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:0;min-height:calc(100vh - 60px)}
.mapcol{padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mapbox{position:relative;width:min(100%,calc(84vh * 838 / 1032));aspect-ratio:838/1032;overflow:auto;border-radius:12px;overscroll-behavior:contain}
.map{position:relative;width:calc(100% * var(--z,1));aspect-ratio:838/1032}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:9}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mapwrap{position:relative;width:min(100%,calc(84vh * 838 / 1032))}
.mapwrap .mapbox{width:100%}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.lg{width:13px;height:13px;border-radius:50%;display:inline-block}
.pin{position:absolute;width:var(--pz,46px);height:var(--pz,46px);margin:calc(var(--pz,46px) / -2) 0 0 calc(var(--pz,46px) / -2);border-radius:50%;padding:max(3px,calc(var(--pz,46px) / 11));border:none;box-shadow:0 2px 6px rgba(0,0,0,.28);background:var(--track);transition:transform .15s}
.pin.thin{--tw:calc(var(--pz,46px) - 2 * (max(3px,calc(var(--pz,46px) / 11)) - max(1.5px,calc(var(--pz,46px) / 24))));width:var(--tw);height:var(--tw);margin:calc(var(--tw) / -2) 0 0 calc(var(--tw) / -2);padding:max(1.5px,calc(var(--pz,46px) / 24))} /* same photo, same 2px gap, thinner ring = smaller pin */
.pin.dash{padding:0;border:max(3px,calc(var(--pz,46px) / 11)) dashed var(--track);background:#fff}
.pin img{width:100%;height:100%;border-radius:50%;display:block;padding:2px;background:#fff;object-fit:cover;clip-path:none}
.pin:hover,.pin.sel{transform:scale(1.18);z-index:5}
.pin.sel{box-shadow:0 0 0 3px #2563EB,0 2px 6px rgba(0,0,0,.28)}
.pin .fd{position:absolute;right:-3px;top:-3px;width:15px;height:15px;border-radius:50%;background:var(--fest);border:2px solid #fff}
.pin .soon{position:absolute;right:-6px;bottom:-5px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid var(--peak);display:grid;place-items:center}
.pin .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font:700 11px 'Noto Sans JP',sans-serif;white-space:nowrap;color:#1C1917;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none;display:none}
.pin:hover .lbl,.pin.sel .lbl,.pin:focus-visible .lbl{display:block}
.panel{border-left:1px solid var(--line);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 60px);overflow:auto;position:sticky;top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font-size:20px;line-height:1.2;margin:0}
h2{font-size:22px;line-height:1.2;margin:0}
.sub{font-size:12px;color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:hover{border-color:var(--mute)}
.row img{width:56px;height:56px;border-radius:10px;flex:none}
.row .t{display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:700;font-size:14px;font-family:'Noto Sans JP',Inter,sans-serif}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{border-radius:10px;padding:1px 8px;font:600 11px 'Noto Sans JP',Inter,sans-serif;white-space:nowrap;border:1.5px solid transparent}
.tag.dash{border-style:dashed}
.tag.fe{background:#FDEBDD;color:#8A3A08}
.hero{width:100%;aspect-ratio:16/9;border-radius:14px;display:block;object-fit:cover}
.pl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl img{width:44px;height:44px;border-radius:50%}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:6px}
.bar i{position:absolute;top:0;height:8px;border-radius:4px}
.bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink)}
dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px}
dt{color:var(--mute)}dd{margin:0}
.warn{font-size:12px;color:#92400E;background:#FEF3C7;border-radius:8px;padding:6px 10px}
.back{align-self:flex-start;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
a{color:#1D4ED8;overflow-wrap:anywhere}
.small{font-size:12px;color:var(--mute)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.panel{border-left:0;border-top:1px solid var(--line);max-height:none;position:static}.mapwrap{width:100%}}
@media(prefers-reduced-motion:reduce){.pin{transition:none}}
</style>
</head>

/* ---------- status model ---------- */
const FRESH=[[7,14],[3,6],[4,8],[3,6],[7,14]];
const LEAD=14; // days before the usual start that まだ appears; otherwise off-season = 終了
function stageAt(p,d){
  const[s,ps,pe,e]=[p[2],p[3],p[4],p[5]].map(md2d);
  if(d<s)return s-d<=LEAD?{lv:0,pct:0,untilPeak:ps-d,untilStart:s-d}:{lv:4,pct:0,untilPeak:-1,off:1};
  if(d<ps){const pct=Math.round(10+60*(d-s)/(ps-s));return{lv:1,pct,untilPeak:ps-d}}
  if(d<=pe)return{lv:2,pct:100,untilPeak:0};
  if(d<=e)return{lv:3,pct:100,untilPeak:-1};
  const n=s+365-d; // next season
  return n<=LEAD?{lv:0,pct:0,untilPeak:ps+365-d,untilStart:n}:{lv:4,pct:0,untilPeak:-1,off:1};
}
function status(spot,p,d){
  const leaf=!!TYPES[p[0]].leaf;
  if(!spot.official){const u=stageAt(p,d);return{...u,leaf,src:'usual',dash:true,soon:false}}
  const age=st.stale?st.staleDays:(d%3);
  const truth=stageAt(p,d-st.offset);
  const rep=stageAt(p,d-st.offset-age);           // what the last report said
  const [fresh,aging]=FRESH[rep.lv];
  if(age>21){const u=stageAt(p,d);return{...u,leaf,src:'none',dash:true,age,soon:false}}
  if(age>aging)return{...rep,leaf,src:'stale',dash:true,age,soon:false};  // last confirmed, never backwards
  return{...rep,leaf,src:age>fresh?'aging':'official',dash:false,age,soon:rep.lv<2&&truth.untilPeak>0&&truth.untilPeak<=5};
}
const festOn=(id,d)=>FEST.filter(f=>f.spots.includes(id)&&d>=md2d(f.from)&&d<=md2d(f.to));
const rank=s=>s.illum?({lit:600,closed:250,before:200-Math.min(s.untilStart,99),over:0,next:0}[s.state]):s.lv===2?500:s.lv===1?400:s.lv===3?300:s.lv===0?200-Math.min(s.untilStart??99,99):0;
function spotState(spot,d){
  const list=spot.pl.map(p=>({p,s:status(spot,p,d)})).concat((ILLUM[spot.id]||[]).map(ev=>({p:['illum'],ev,s:illumStatus(ev,cur())})));
  // tie-break within the same stage: the planting with more of that stage still ahead wins
  // (e.g. two at 見頃: the one whose peak ends later), so a fading flower doesn't front the pin
  const tie=x=>x.ev?0:x.s.lv===1?x.s.pct:x.s.lv===2?md2d(x.p[4]):x.s.lv===3?md2d(x.p[5]):0;
  const better=(a,b)=>rank(b.s)>rank(a.s)||(rank(b.s)===rank(a.s)&&tie(b)>tie(a));
  const best=list.reduce((a,b)=>better(a,b)?b:a);
  return{list,best,fest:festOn(spot.id,d)};
}

}
function visibleSpots(d){
  return SPOTS.map(spot=>{const ss=spotState(spot,d);if(st.filter==='illum'){const il=ss.list.filter(x=>x.ev);if(il.length)ss.best=il.reduce((a,b)=>rank(b.s)>rank(a.s)?b:a)}return{spot,ss}}).filter(({ss})=>st.filter==='all'||(st.filter==='active'&&ss.best.s.lv!==4)||(st.filter==='peak'&&ss.best.s.lv===2)||(st.filter==='fest'&&ss.fest.length)||(st.filter==='illum'&&ss.list.some(x=>x.s.illum&&(x.s.state==='lit'||x.s.state==='closed'))));
}

/* ---------- panel ---------- */
function tag(s,t){
  if(s.illum){const lit=s.state==='lit';return `<span class="tag${s.dash?' dash':''}" style="background:${lit?'#2A2340':'var(--line)'};color:${lit?'#F5D46B':'var(--mute)'};border-color:${s.dash?(lit?'#D4A017':'#A8A29E'):'transparent'}">${esc(t?T('イルミ','Illum')+' ':'')}${esc(sName(s))}</span>`}
  const c=colorOf(s.lv,s.leaf),dark=s.lv===2||s.lv===3;
  const bg=s.lv===0||s.lv===4?'var(--line)':s.lv===1?'#FBE3EC':c;
  const fg=dark?'#fff':s.lv===1?(s.leaf?'#8A4B06':'#8E1E4A'):'var(--mute)';
  const pct=s.lv===1&&!s.dash&&!s.leaf?` ${Math.round(s.pct/10)}${T('分','/10')}`:'';
  return `<span class="tag${s.dash?' dash':''}" style="background:${s.lv===1&&s.leaf?'#FCEBD3':bg};color:${fg};border-color:${s.dash?c==='#E7E5E4'?'#A8A29E':c:'transparent'}">${esc(t?typeName(t)+' ':'')}${esc(stageName(s.lv,s.leaf))}${pct}</span>`}
function cycleLine(s,p){
  if(!p||s.illum)return '';
  if(s.lv===0)return T(`例年 ${p[6]}`,`Usually ${p[6]}`);
  if(s.lv===4)return T(`次回 例年 ${p[6]}`,`Next: usually ${p[6]}`);
  return '';
}
function srcLine(s,ev){
  if(s.illum){ev=ev||{};const ph=ev.ok===0?T('（前年の日程を仮置き）',' (last year’s dates as placeholder)'):'';
    const off=ev.spot&&closedToday(ev.spot,cur());
    const m={lit:off?T(`点灯時間 ${s.hours}`,`Lit ${s.hours}`):T(`今夜 ${s.hours}`,`Tonight ${s.hours}`),closed:T('本日は休園日・点灯なし','Closed today, no lighting'),before:T(`${fmtMD(ev.from.slice(5))}から点灯予定`,`Lighting from ${fmtMD(ev.from.slice(5))}`),over:T('今季は終了','Finished for the season'),next:T('次回の日程は未発表','Next dates not announced')}[s.state];
    return m+ph}
  if(s.src==='usual')return T('例年の時期から推定','Estimated from usual window');
  if(s.src==='none')return T('最新情報なし（3週間以上）・例年の時期を表示','No recent info (3+ weeks) · showing usual window');
  if(s.src==='stale')return T(`最終確認 ${s.age}日前の状態`,`Last confirmed ${s.age} days ago`);
  if(s.src==='aging')return T(`公式 · ${s.age}日前（古くなりつつある）`,`Official · ${s.age} days ago (aging)`);
  return T(`公式 · ${s.age===0?'今日':s.age+'日前'}`,`Official · ${s.age===0?'today':s.age+' days ago'}`);
}
function renderList(d){
  const all=visibleSpots(d).sort((a,b)=>rank(b.ss.best.s)-rank(a.ss.best.s)||(b.ss.fest.length-a.ss.fest.length));
  const hidden=SPOTS.length-all.length;
  const nLit=all.filter(x=>x.ss.list.some(y=>y.s.illum&&y.s.state==='lit')).length,nPeak=all.filter(x=>x.ss.best.s.lv===2&&!x.ss.best.s.illum).length,nStart=all.filter(x=>x.ss.best.s.lv===1&&!x.ss.best.s.illum).length;
  const dt=cur();
  return `<div><h1>${esc(st.en?dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}):dt.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}))}</h1>
  <div class="sub">${esc(T(`見頃 ${nPeak} · 咲き始め ${nStart} · 点灯中 ${nLit} · 全${all.length}スポット`,`${nPeak} at peak · ${nStart} starting · ${nLit} lit · ${all.length} spots`))}${st.filter==='active'&&hidden?' · '+esc(T(`終了 ${hidden}件は非表示`,`${hidden} finished hidden`)):''}</div></div>
  <div class="chips">${[['active','シーズン中','In season'],['peak','見頃のみ','Peak only'],['fest','開催中のイベント','Festivals on'],['illum','イルミネーション','Illuminations'],['all','すべて表示','Show all']].map(([k,j,e])=>`<button class="chip" data-f="${k}" aria-pressed="${st.filter===k}">${esc(T(j,e))}</button>`).join('')}</div>
  ${all.length?all.map(({spot,ss})=>{const s=ss.best.s;
    return `<button class="row" data-id="${esc(spot.id)}"><img alt="" src="${photo(ss.best.p[0])}" style="${imgFilter(s)}"><span class="t"><span><span class="nm">${esc(T(spot.ja,spot.en))}</span> <span class="small">${esc(spot.city)}</span>${closedPill(spot.id)}</span>
    <span class="tags">${tag(s,ss.best.p[0])}${ss.fest.map(f=>`<span class="tag fe">${esc(T(f.ja+' 開催中',f.en+' on'))}</span>`).join('')}</span>
    <span class="small">${esc(cycleLine(s,ss.best.p)||srcLine(s,ss.best.ev))}${s.soon&&!s.illum?' · '+esc(T('もうすぐ見頃','Peak soon')):''}</span></span></button>`}).join(''):`<p class="small">${esc(T('該当するスポットはありません。','No spots match.'))} <button class="chip" data-f="all">${esc(T('すべて表示','Show all'))}</button></p>`}`;
}
function renderDetail(spot,d){
  const ss=spotState(spot,d),s=ss.best.s;
  const cyc=x=>{const st0=md2d(x.p[2]),en=md2d(x.p[5]);return st0-d+(d>en?365:0)}; // rolling year from today: in season first, then upcoming, finished ones last
  const sorted=ss.list.filter(x=>!x.ev).sort((a,b)=>cyc(a)-cyc(b)),ills=ss.list.filter(x=>x.ev);
  return `<button class="back" id="back">← ${esc(T('一覧','List'))}</button>
  <img class="hero" alt="" src="${photo(ss.best.p[0])}" style="${imgFilter(s)}">
  <div><h2>${esc(T(spot.ja,spot.en))}${closedPill(spot.id)}</h2><div class="sub">${esc(spot.city)} · ${esc(T('写真はプレースホルダー','Placeholder photo'))}</div></div>
  ${ss.fest.map(f=>`<div class="tags"><span class="tag fe">${esc(T(f.ja+' 開催中',f.en+' on'))}</span><span class="small">${esc(fmtMD(f.from)+'–'+fmtMD(f.to))} ${esc(f.ok?T('（2027年公式）','(2027 official)'):T('（2026年日程を仮置き）','(2026 dates as placeholder)'))}</span></div>`).join('')}
  ${ills.map(({ev,s})=>`<div class="pl"><img alt="" src="${photo('illum')}" style="${imgFilter(s)}"><div>
    <div class="tags"><span class="nm">${esc(T(ev.ja,ev.en))}</span>${tag(s)}</div>
    <div class="small">${esc(srcLine(s,ev))}</div>
    <div class="small">${esc(T('期間','Period'))} ${esc(ev.from.replace(/-/g,'/'))}–${esc(ev.to.replace(/-/g,'/'))}${ev.bulbs?' · '+esc(ev.bulbs):''}${ev.note?' · '+esc(ev.note):''}</div>
    <div class="small"><a href="${esc(ev.src)}" target="_blank" rel="noopener">${esc(T('情報元','Source'))}</a></div>
  </div></div>`).join('')}
  <div>${sorted.map(({p,s})=>{const ty=TYPES[p[0]],y0=0,yr=365,l=v=>(md2d(v)/yr*100).toFixed(2);
    return `<div class="pl"><img alt="" src="${photo(p[0])}" style="${imgFilter(s)}"><div>
    <div class="tags"><span class="nm">${esc(typeName(p[0]))}</span>${p[1]?`<span class="small">${esc(p[1])}</span>`:''}${tag(s)}</div>
    <div class="small">${esc(cycleLine(s,p)||srcLine(s)+' · '+T('例年','Usual')+' '+p[6])}</div>
    <div class="bar" title="${esc(T('1年の中の時期','Position in the year'))}"><i style="left:${l(p[2])}%;width:${(l(p[5])-l(p[2])).toFixed(2)}%;background:${ty.leaf?'#F3C99A':'#F6C9D8'}"></i><i style="left:${l(p[3])}%;width:${(l(p[4])-l(p[3])).toFixed(2)}%;background:${ty.leaf?'#C2410C':'#B0245C'}"></i><b style="left:${(d/yr*100).toFixed(2)}%"></b></div>
    </div></div>`}).join('')}</div>
  ${spot.prec===0?`<div class="warn">${esc(T('座標は町字レベル（概略）。地図上の位置は要手動修正。','Coordinates are neighbourhood-level only; pin needs manual placement.'))}</div>`:''}
  <dl><dt>${esc(T('時間','Hours'))}</dt><dd>${esc(spot.hours)}</dd><dt>${esc(T('料金','Fee'))}</dt><dd>${esc(spot.fee)}</dd><dt>${esc(T('駐車場','Parking'))}</dt><dd>${esc(spot.parking)}</dd>
  <dt>${esc(T('座標','Coords'))}</dt><dd>${spot.lat.toFixed(5)}, ${spot.lng.toFixed(5)}</dd><dt>${esc(T('出典','Source'))}</dt><dd>${spot.src.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>')}</dd>
  <dt>${esc(T('状況元','Status'))}</dt><dd>${esc(spot.pl.length?(spot.official?T('公式ページ（シミュレーション）','Official page (simulated)'):T('なし — 例年の時期のみ','None — usual window only')):T('イルミの日程・休園日から判定','From illumination dates and closed days'))}</dd></dl>`;
}
function renderLegend(){
  const it=[['#E7E5E4','まだ','Not yet',''],['#E58FAD','咲き始め','Starting',''],['#B0245C','見頃','Peak',''],['#9E7F89','見頃過ぎ','Past peak',''],['#C2410C','紅葉 見頃','Leaves peak','']];
  $('legend').innerHTML=it.map(([c,j,e])=>`<span><i class="lg" style="border:3px solid ${c}"></i>${esc(T(j,e))}</span>`).join('')+
  `<span><i class="lg" style="${st.est==='dashed'?'border:3px dashed #57534E':st.est==='faded'?'border:3px solid #B0245C66':'border:1.5px solid #57534E'}"></i>${esc(T(st.est==='thin'?'細いリング = 例年・推定':st.est==='faded'?'淡いリング = 例年・推定':'点線 = 例年・推定','Thin'===''?'':(st.est==='thin'?'Thin ring = usual / estimate':st.est==='faded'?'Faded ring = usual / estimate':'Dashed = usual / estimate')))}</span><span><i class="lg" style="background:conic-gradient(#E58FAD 0 50%,#E7E5E4 50% 100%)"></i>${esc(T('リング=咲き具合','Ring = bloom %'))}</span><span><i class="lg" style="border:3px solid #D4A017;background:#2A2340"></i>${esc(T('イルミ点灯中','Illumination lit'))}</span><span><i class="lg" style="background:#E0701F"></i>${esc(T('イベント開催中','Festival on'))}</span><span><i class="lg" style="border:2px solid #B0245C"></i>${esc(T('もうすぐ見頃','Peak soon'))}</span>`;
}

/* ---------- render + controls ---------- */
function render(){
  const d=date2d(cur());
  $('date').value=st.date;$('slider').value=Math.round((cur()-ORIGIN)/864e5);
  $('offset').value=st.offset;$('offv').textContent=(st.offset>0?'+':'')+st.offset+'d';
  $('stale').checked=st.stale;$('staleDays').value=String(st.staleDays);$('lang').textContent=st.en?'日本語':'EN';$('estStyle').value=st.est;
  document.documentElement.lang=st.en?'en':'ja';
  renderPresets();$('map').innerHTML=drawBase();renderLegend();drawPins();
  const sp=SPOTS.find(x=>x.id===st.sel);
  $('panel').innerHTML=sp?renderDetail(sp,d):renderList(d);
  save();
}
const setDate=dt=>{if(dt<ORIGIN)dt=new Date(ORIGIN);const max=new Date(2027,11,31);if(dt>max)dt=max;st.date=iso(dt);render()};
const shift=n=>{const d=cur();d.setDate(d.getDate()+n);setDate(d)};
$('dm7').onclick=()=>shift(-7);$('dm1').onclick=()=>shift(-1);$('dp1').onclick=()=>shift(1);$('dp7').onclick=()=>shift(7);
$('date').onchange=e=>{if(e.target.value){const[y,m,d]=e.target.value.split('-').map(Number);setDate(new Date(y,m-1,d))}};
$('slider').oninput=e=>{const d=new Date(ORIGIN);d.setDate(d.getDate()+Number(e.target.value));setDate(d)};
$('offset').oninput=e=>{st.offset=Number(e.target.value);render()};
$('stale').onchange=e=>{st.stale=e.target.checked;render()};
$('staleDays').onchange=e=>{st.staleDays=Number(e.target.value);render()};
$('lang').onclick=()=>{st.en=!st.en;render()};
$('estStyle').onchange=e=>{st.est=e.target.value;render()};
const setZoom=z=>{const box=$('mapbox'),cx=(box.scrollLeft+box.clientWidth/2)/box.scrollWidth,cy=(box.scrollTop+box.clientHeight/2)/box.scrollHeight;st.zoom=Math.max(1,Math.min(4,z));$('map').style.setProperty('--z',st.zoom);requestAnimationFrame(()=>{box.scrollLeft=cx*box.scrollWidth-box.clientWidth/2;box.scrollTop=cy*box.scrollHeight-box.clientHeight/2})};
$('zin').onclick=()=>setZoom(st.zoom*1.6);$('zout').onclick=()=>setZoom(st.zoom/1.6);
const PRE=[['今日','Today',null],['梅','Plum','2027-02-24'],['河津桜','Kawazu','2027-03-01'],['桜','Cherry','2027-04-03'],['ネモフィラ','Nemophila','2027-04-25'],['花菖蒲','Iris','2027-06-10'],['紫陽花','Hydrangea','2027-06-28'],['ひまわり','Sunflower','2027-08-28'],['紅葉','Leaves','2027-11-20'],['イルミ','Illum','2026-12-20']];
function renderPresets(){$('presets').innerHTML=PRE.map(([j,e,v],i)=>`<button class="btn" data-p="${i}">${esc(T(j,e))}</button>`).join('')}
$('presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const v=PRE[b.dataset.p][2];if(!v){setDate(new Date())}else{const[y,m,d]=v.split('-').map(Number);setDate(new Date(y,m-1,d))}};
$('panel').onclick=e=>{
  const f=e.target.closest('[data-f]');if(f){st.filter=f.dataset.f;render();return}
  const r=e.target.closest('[data-id]');if(r){st.sel=r.dataset.id;render();$('panel').scrollTop=0;return}
  if(e.target.closest('#back')){st.sel=null;render()}
};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')shift(e.shiftKey?7:1);if(e.key==='ArrowLeft')shift(e.shiftKey?-7:-1);if(e.key==='Escape'&&st.sel){st.sel=null;render()}});
$('map').addEventListener('click',e=>{if(!e.target.closest('.pin')&&st.sel){st.sel=null;render()}});
const ro=new ResizeObserver(()=>drawPins());ro.observe($('map'));
render();
}
</script>
</body>
